apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: cloudtask-ingress
  namespace: cloudtask
spec:
  rules:
    - host: cloudtask.local
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: frontend-service
                port:
                  number: 3000
