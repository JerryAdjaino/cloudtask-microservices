services:
  mongodb:
    image: mongo:7.0
    restart: unless-stopped
    environment:
      MONGO_INITDB_ROOT_USERNAME: ${MONGO_USERNAME:-cloudtask}
      MONGO_INITDB_ROOT_PASSWORD: ${MONGO_PASSWORD:?Set MONGO_PASSWORD in .env}
    volumes:
      - mongodb_data:/data/db
    networks:
      - cloudtask

  task-service:
    build: ./task-service
    restart: unless-stopped
    environment:
      PORT: 4000
      MONGO_HOST: mongodb
      MONGO_PORT: 27017
      MONGO_DB: cloudtask
      MONGO_USERNAME: ${MONGO_USERNAME:-cloudtask}
      MONGO_PASSWORD: ${MONGO_PASSWORD:?Set MONGO_PASSWORD in .env}
    depends_on:
      - mongodb
    networks:
      - cloudtask

  analytics-service:
    build: ./analytics-service
    restart: unless-stopped
    environment:
      PORT: 5000
      TASK_SERVICE_URL: http://task-service:4000
      REQUEST_TIMEOUT_MS: 4000
    depends_on:
      - task-service
    networks:
      - cloudtask

  frontend-service:
    build: ./frontend-service
    restart: unless-stopped
    environment:
      PORT: 3000
      TASK_SERVICE_URL: http://task-service:4000
      ANALYTICS_SERVICE_URL: http://analytics-service:5000
      REQUEST_TIMEOUT_MS: 5000
    depends_on:
      - task-service
      - analytics-service
    ports:
      - "3000:3000"
    networks:
      - cloudtask

volumes:
  mongodb_data:

networks:
  cloudtask:
